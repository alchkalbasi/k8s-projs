# Main config for running nginx as a non-root user (uid 101 "nginx"):
# pid file and temp dirs live in /tmp, and the server listens on 8080 (>1024).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rendered from /etc/nginx/templates/*.template by the image entrypoint at startup.
    include /etc/nginx/conf.d/*.conf;
}
