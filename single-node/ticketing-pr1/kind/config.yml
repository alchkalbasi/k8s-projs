kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ticketing            # context: kind-ticketing, nodes: ticketing-control-plane, ticketing-worker, ticketing-worker2

# Access is via `kubectl port-forward` (no Ingress / NodePort in Project 1),
# so no extraPortMappings or ingress-ready label are needed.
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
